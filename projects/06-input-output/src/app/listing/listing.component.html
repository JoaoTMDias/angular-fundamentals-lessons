<article class="listing">
  <div class="image-parent">
    <img class="product-image" src="https://placehold.co/100x100" />
  </div>
  <section class="details">
    <p class="title"><!-- car make and model--></p>
    <hr />
    <p class="detail">
      <span>Year</span>
      <span><!-- year --></span>
    </p>
    <div class="detail">
      <span>Transmission</span>
      <span><!-- transmission --></span>
    </div>
    <p class="detail">
      <span>Mileage</span>
      <span><!-- miles --></span>
    </p>
    <p class="detail">
      <span>Price</span>
      <span><!-- price --></span>
    </p>
  </section>
  <button (click)="handleCarSaved()">Add {{ car.make}} to Saved Cars</button>
</article>
